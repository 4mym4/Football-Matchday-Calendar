name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The nightly fetch commits with the default GITHUB_TOKEN, and pushes
  # made with that token don't trigger `on: push` workflows (GitHub's
  # anti-recursion safeguard). So also deploy whenever that workflow
  # finishes.
  workflow_run:
    workflows: [Update fixtures]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time; don't cancel a run that's mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # No build step: this is plain HTML/CSS/JS with ES modules, so the
      # repository root is uploaded as-is.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
