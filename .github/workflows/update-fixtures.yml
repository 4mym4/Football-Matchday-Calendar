name: Update fixtures

on:
  schedule:
    # 03:15 UTC nightly. Deliberately off the hour: scheduled workflows on
    # GitHub's shared runners queue heavily at :00, so an odd minute usually
    # starts sooner. Note GitHub may still delay or skip runs under load.
    - cron: '15 3 * * *'
  # Lets you trigger a run by hand from the Actions tab (useful for the
  # very first run, and for testing).
  workflow_dispatch:

# Needed so the workflow can commit the refreshed data file back to the repo.
permissions:
  contents: write

# If a manual run overlaps the nightly one, let the newer run win rather
# than having two jobs commit to the same file.
concurrency:
  group: update-fixtures
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch fixtures from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/fetch-fixtures.js

      - name: Commit updated fixtures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json
          # `git commit` exits non-zero when there is nothing staged, which
          # would fail the whole job on a quiet day with no fixture changes.
          if git diff --staged --quiet; then
            echo "No fixture changes to commit."
          else
            git commit -m "Update fixtures ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
